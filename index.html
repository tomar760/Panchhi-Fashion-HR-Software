<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="flex items-center justify-center min-h-screen bg-gray-50">
    <div class="w-full max-w-md p-8 bg-white rounded-3xl shadow-xl border border-gray-100">
        <div class="flex justify-center mb-6">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center text-white font-bold text-3xl shadow-lg shadow-indigo-500/30">P</div>
        </div>
        <h2 class="text-2xl font-bold text-center text-gray-900 mb-2">Welcome to Panchhi HR</h2>
        <p class="text-center text-sm text-gray-500 mb-8">Login to manage your enterprise suite</p>
        
        <form onsubmit="event.preventDefault(); window.location.href='modules/dashboard.html';" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
                <input type="email" value="admin@panchhi.com" class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-500" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <input type="password" value="password" class="w-full border border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-indigo-500" required>
            </div>
            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" class="rounded text-indigo-600" checked>
                    <span class="text-gray-600">Remember me</span>
                </label>
                <a href="#" class="text-indigo-600 font-medium hover:text-indigo-800">Forgot Password?</a>
            </div>
            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl text-white font-bold shadow-lg shadow-indigo-200 hover:scale-[1.02] transition">
                Login to Dashboard
            </button>
        </form>
    </div>
</body>
</html>
