<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panchhi HR Software | Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-overlay" id="loginOverlay">
        <div class="login-card">
            <div class="login-logo">
                <div class="logo-icon"><i class="fas fa-feather-pointed"></i></div>
                <h1 class="aditya-branding">Panchhi HR Software</h1>
                <p>Designed & Managed by Aditya</p>
            </div>
            <div class="form-group">
                <label>Username or Email</label>
                <input type="text" id="loginUser" placeholder="admin@panchhihr.com" value="admin@panchhihr.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPass" placeholder="Enter your password" value="••••••••">
            </div>
            <button class="login-btn ripple" id="loginBtn" onclick="handleLogin()">
                <i class="fas fa-arrow-right"></i>&nbsp; Sign In to Dashboard
            </button>
            <div class="login-footer">
                <p>© 2026 Panchhi HR Software by Aditya Tomar — v2.4.0</p>
            </div>
        </div>
    </div>
    
    <!-- Toast Required For JS -->
    <div class="toast" id="toast">
        <div class="toast-icon" id="toastIcon"><i class="fas fa-check"></i></div>
        <div class="toast-text"><h4 id="toastTitle"></h4><p id="toastMessage"></p></div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
