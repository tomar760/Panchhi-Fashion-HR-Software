<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Store Inventory - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- LIGHT SIDEBAR -->
    <aside class="w-[250px] bg-white border-r border-gray-200 flex flex-col z-20 h-full">
        <!-- Exact Same Sidebar Details from employees.html -->
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="w-10 h-10 bg-[#7c3aed] rounded-lg flex items-center justify-center text-white font-bold text-xl mr-3">P</div>
            <div><h1 class="text-gray-900 font-bold text-lg leading-tight">Panchhi HR</h1></div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-th-large w-5 text-center"></i> <span class="text-sm font-medium">Dashboard</span></a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">Operations</p></div>
            <a href="store.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-900 bg-gray-100 rounded-lg transition font-bold"><i class="fas fa-boxes w-5 text-center"></i> <span class="text-sm font-medium">Store & Inventory</span></a>
            <a href="employees.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-arrow-left w-5 text-center"></i> <span class="text-sm font-medium">Back to HR</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <div class="text-sm font-medium text-gray-500"><i class="fas fa-home text-indigo-600 mr-2"></i> / Operations / <span class="text-gray-800 ml-1">Store & Inventory</span></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 grid grid-cols-1 xl:grid-cols-3 gap-8">
            <!-- Issue Form -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                <h3 class="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3"><i class="fas fa-dolly text-[#7c3aed] mr-2"></i> Issue New Asset</h3>
                <div class="space-y-4">
                    <div><label class="text-xs font-bold text-gray-500">E-Code *</label><input type="text" class="w-full p-2.5 border rounded-lg text-sm bg-gray-50 outline-none"></div>
                    <div><label class="text-xs font-bold text-gray-500">Item Name *</label><input type="text" class="w-full p-2.5 border rounded-lg text-sm outline-none"></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-gray-500">Qty *</label><input type="number" class="w-full p-2.5 border rounded-lg text-sm outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500">Condition</label><select class="w-full p-2.5 border rounded-lg text-sm outline-none"><option>New</option><option>Used/Old</option></select></div>
                    </div>
                    
                    <!-- PR / PO Number Rule (Mandatory) -->
                    <div>
                        <label class="text-xs font-bold text-gray-500">PR / PO Number <span class="text-rose-500">*</span></label>
                        <input type="text" id="poNumber" placeholder="Enter valid PO/PR No." class="w-full p-2.5 border rounded-lg text-sm outline-none focus:border-rose-500">
                    </div>

                    <!-- Receipt Upload Zone -->
                    <div class="border-2 border-dashed border-gray-200 rounded-xl bg-gray-50 p-6 text-center cursor-pointer hover:bg-gray-100 transition">
                        <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                        <p class="text-xs font-bold text-gray-600">Upload Receipt / PO (Max 5MB)</p>
                    </div>

                    <button onclick="issueAsset()" class="w-full py-3 bg-[#7c3aed] text-white rounded-lg text-sm font-bold shadow-md hover:bg-purple-700 transition">Issue to Employee</button>
                </div>
            </div>

            <!-- Table -->
            <div class="xl:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-fit">
                <div class="p-5 border-b border-gray-100 bg-gray-50"><h3 class="font-bold text-gray-900 text-sm">Recent Issued Assets</h3></div>
                <table class="w-full text-left">
                    <thead class="bg-white border-b border-gray-100">
                        <tr><th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase">Item</th><th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase">Issued To</th><th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase">PR/PO No.</th><th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase">Receipt</th></tr>
                    </thead>
                    <tbody><tr><td colspan="4" class="text-center py-8 text-gray-400">No assets issued recently.</td></tr></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Store Strict Validation Logic
        function issueAsset() {
            const po = document.getElementById('poNumber').value.trim();
            if (!po) {
                alert("🚨 STRICT RULE ALARM: Please enter a valid PR/PO Number to proceed. Asset cannot be issued without tracking number.");
                document.getElementById('poNumber').focus();
            } else {
                alert("✅ Success! Asset Issued & Logged in Cloud.");
            }
        }
    </script>
</body>
</html>
