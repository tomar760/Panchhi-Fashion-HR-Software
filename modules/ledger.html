<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ledger - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-gray-50">
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Advance & Loan Ledger</h2>
                <a href="dashboard.html" class="text-indigo-600 text-sm font-bold hover:underline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
            <button onclick="document.getElementById('ledgerModal').classList.remove('hidden')" class="px-5 py-2.5 bg-indigo-600 text-white rounded-xl text-sm font-bold shadow-lg">Issue New Credit</button>
        </div>
        <div class="bg-white rounded-2xl border shadow-sm overflow-hidden">
            <table class="w-full">
                <thead class="bg-gray-50"><tr><th>Employee</th><th>Type</th><th>Amount</th><th>Status</th></tr></thead>
                <tbody><tr><td class="font-bold">MIS Sync Pending</td><td>-</td><td>-</td><td>-</td></tr></tbody>
            </table>
        </div>
    </div>
    
    <div id="ledgerModal" class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-4">
            <h2 class="text-lg font-bold">Issue Advance / Loan</h2>
            <input type="text" placeholder="E-Code" class="w-full p-2.5 border rounded-lg text-sm">
            <input type="number" placeholder="Amount (₹)" class="w-full p-2.5 border rounded-lg text-sm">
            <div class="flex justify-end gap-2 mt-4">
                <button onclick="document.getElementById('ledgerModal').classList.add('hidden')" class="px-4 py-2 border rounded-lg font-bold text-sm">Cancel</button>
                <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-bold text-sm">Save</button>
            </div>
        </div>
    </div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
