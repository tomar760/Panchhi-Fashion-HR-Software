<div class="stat-cards">
  <div class="stat-card"><div class="stat-icon amber"><i class="fas fa-door-open"></i></div><div class="stat-number">Live</div><div class="stat-label">Gate Pass Module</div></div>
</div>

<div style="display:grid;grid-template-columns:1fr 1.5fr;gap:24px">
  <div class="form-card">
    <h3><i class="fas fa-plus-circle" style="color:var(--primary)"></i> Issue New Gate Pass</h3>
    <div class="form-group">
      <label>Employee Name & Dept</label>
      <select id="gpEmpName">
        <option value="">Select Employee...</option>
        <option value="Rajesh Kumar - Operations">E-101 — Rajesh Kumar (Operations)</option>
        <option value="Priya Patel - HR">E-105 — Priya Patel (HR)</option>
      </select>
    </div>
    <div class="form-group">
      <label>Reason for Exit</label>
      <textarea id="gpPurpose" placeholder="Official work, medical..."></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Out Time</label><input type="time" id="gpOutTime" value="10:00"></div>
      <div class="form-group"><label>Expected In</label><input type="time" id="gpInTime"></div>
    </div>
    <button class="btn btn-primary ripple" style="width:100%;justify-content:center" onclick="submitGatePass(this)">
      <i class="fas fa-paper-plane"></i> Save to Google Sheet
    </button>
  </div>

  <div class="table-card">
    <div class="table-header"><h3><i class="fas fa-location-dot" style="color:var(--warning)"></i> Status</h3></div>
    <div class="table-wrapper">
      <!-- Baad me is table ko bhi Google sheet se reverse-sync kar lenge -->
      <div style="padding:20px; color:var(--gray-500); text-align:center;">Data will sync here from sheet soon.</div>
    </div>
  </div>
</div>
