<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate Pass Tracker - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen">

    <!-- SIDEBAR -->
    <aside class="w-[250px] bg-white border-r border-gray-200 flex flex-col z-20 h-full shrink-0">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="w-10 h-10 bg-[#7c3aed] rounded-lg flex items-center justify-center text-white font-bold text-xl mr-3">P</div>
            <div>
                <h1 class="text-gray-900 font-bold text-lg leading-tight">Panchhi HR</h1>
                <p class="text-gray-400 text-[10px] tracking-widest uppercase">Enterprise Suite</p>
            </div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1 custom-scrollbar">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                <i class="fas fa-th-large w-5 text-center"></i> <span class="text-sm font-medium">Dashboard</span>
            </a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">HR & Payroll</p></div>
            <a href="employees.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                <i class="fas fa-users w-5 text-center"></i> <span class="text-sm font-medium">Employee Directory</span>
            </a>
            <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                <i class="fas fa-user-clock w-5 text-center"></i> <span class="text-sm font-medium">Attendance & Leaves</span>
            </a>
            <a href="gatepass.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-900 bg-gray-100 rounded-lg transition font-bold">
                <i class="fas fa-id-badge w-5 text-center"></i> <span class="text-sm">Gate Pass Tracker</span>
            </a>
            <a href="ledger.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                <i class="fas fa-file-invoice-dollar w-5 text-center"></i> <span class="text-sm font-medium">Advance & Ledger</span>
            </a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">Operations</p></div>
            <a href="store.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition">
                <i class="fas fa-boxes w-5 text-center"></i> <span class="text-sm font-medium">Store & Inventory</span>
            </a>
        </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <div class="flex items-center text-sm font-medium text-gray-500">
                <i class="fas fa-home text-indigo-600 mr-2"></i> / Operations / <span class="text-gray-800 ml-1">Gate Pass Tracker</span>
            </div>
            <div class="flex gap-3">
                <button class="px-4 py-2 border border-gray-200 text-gray-600 bg-white rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-gray-50 transition">
                    <i class="fas fa-file-pdf text-rose-500"></i> Export PDF
                </button>
                <button class="px-4 py-2 border border-gray-200 text-gray-600 bg-white rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-gray-50 transition">
                    <i class="fas fa-file-excel text-emerald-500"></i> Export Excel
                </button>
            </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
            <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                
                <!-- ISSUE GATE PASS FORM -->
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 h-fit">
                    <h3 class="text-lg font-bold text-gray-900 mb-4 border-b pb-3"><i class="fas fa-id-badge text-indigo-500 mr-2"></i> Issue Gate Pass</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-gray-600">E-Code *</label>
                            <input type="text" id="gpEcode" placeholder="e.g. PF/ADM/001" class="w-full p-3 border border-gray-200 rounded-xl text-sm font-mono font-bold mt-1 outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-gray-600">Reason *</label>
                            <textarea id="gpReason" rows="2" placeholder="Describe the reason..." class="w-full p-3 border border-gray-200 rounded-xl text-sm mt-1 outline-none resize-none focus:border-indigo-500"></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="text-xs font-bold text-gray-600">Out Time *</label>
                                <input type="time" id="gpOutTime" class="w-full p-3 border border-gray-200 rounded-xl text-sm mt-1 outline-none focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-gray-600">Exp. Return *</label>
                                <input type="time" id="gpInTime" class="w-full p-3 border border-gray-200 rounded-xl text-sm mt-1 outline-none focus:border-indigo-500">
                            </div>
                        </div>
                        <button id="submitBtn" onclick="submitGatePass()" class="w-full py-3.5 bg-[#7c3aed] text-white rounded-xl text-sm font-bold shadow-md hover:bg-purple-700 transition">
                            <i class="fas fa-paper-plane mr-2"></i> Generate & Sync Pass
                        </button>
                    </div>
                </div>

                <!-- LIVE TRACKING TABLE -->
                <div class="xl:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-fit">
                    <div class="p-5 border-b border-gray-100 bg-white flex justify-between items-center">
                        <h3 class="font-bold text-gray-900 text-sm uppercase">Live Tracking</h3>
                        <span class="bg-amber-50 border border-amber-200 text-amber-600 text-[10px] font-bold px-2.5 py-1 rounded-full flex items-center">
                            <div class="w-1.5 h-1.5 rounded-full bg-amber-500 mr-1.5 animate-pulse"></div> LIVE
                        </span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead class="bg-gray-50 border-b border-gray-100">
                                <tr>
                                    <th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-wider">E-Code</th>
                                    <th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Reason</th>
                                    <th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-wider">Timings</th>
                                    <th class="py-3 px-4 text-xs font-bold text-gray-500 uppercase tracking-wider text-center">Status</th>
                                </tr>
                            </thead>
                            <tbody id="trackingTable" class="divide-y divide-gray-50">
                                <tr><td colspan="4" class="text-center py-6 text-gray-400 font-medium text-sm">No active gate passes right now.</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script>
        // Tumhara naya Web App URL yahan embed kar diya gaya hai
        const API_URL = "https://script.google.com/macros/s/AKfycbzVfo5SFaK6Mv7R3-1qv2nlroS05O9wruRUbB-e8Deez7euzKIz2T8sTlBm-lnna0eW/exec";

        async function submitGatePass() {
            const eCode = document.getElementById('gpEcode').value.trim();
            const reason = document.getElementById('gpReason').value.trim();
            const outTime = document.getElementById('gpOutTime').value;
            const inTime = document.getElementById('gpInTime').value;
            const btn = document.getElementById('submitBtn');

            if (!eCode || !reason || !outTime || !inTime) {
                alert("Please fill all the mandatory fields!");
                return;
            }

            // UI Button Loading State
            const originalText = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-spinner fa-spin mr-2"></i> Syncing to Cloud...`;
            btn.disabled = true;
            btn.classList.add("opacity-70", "cursor-not-allowed");

            const payload = {
                action: "saveGatePass",
                eCode: eCode,
                reason: reason,
                outTime: outTime,
                inTime: inTime,
                status: "OUTSIDE"
            };

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                });

                const result = await response.json();

                if (result.status === "success") {
                    // Update Local Table Preview
                    updateTrackingTable(eCode, reason, outTime, inTime);
                    
                    // Reset Form
                    document.getElementById('gpEcode').value = '';
                    document.getElementById('gpReason').value = '';
                    document.getElementById('gpOutTime').value = '';
                    document.getElementById('gpInTime').value = '';
                    
                    btn.innerHTML = `<i class="fas fa-check mr-2"></i> Generated!`;
                    btn.classList.replace("bg-[#7c3aed]", "bg-emerald-500");
                } else {
                    alert("Error: " + result.message);
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                alert("Network Error: Could not connect to Google Sheets.");
                btn.innerHTML = originalText;
            }

            // Reset button state after 2 seconds
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove("opacity-70", "cursor-not-allowed");
                btn.classList.replace("bg-emerald-500", "bg-[#7c3aed]");
            }, 2000);
        }

        function updateTrackingTable(eCode, reason, out, inc) {
            const tbody = document.getElementById('trackingTable');
            if (tbody.innerText.includes("No active")) tbody.innerHTML = "";

            const tr = document.createElement('tr');
            tr.className = "hover:bg-gray-50/50 transition";
            tr.innerHTML = `
                <td class="py-3 px-4 text-sm font-bold text-indigo-600">${eCode}</td>
                <td class="py-3 px-4 text-sm text-gray-700">${reason}</td>
                <td class="py-3 px-4 text-sm text-gray-700 font-medium">${out} to ${inc}</td>
                <td class="py-3 px-4 text-center">
                    <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-amber-50 border border-amber-200 text-[10px] font-bold text-amber-600">
                        OUTSIDE
                    </span>
                </td>
            `;
            tbody.prepend(tr);
        }
    </script>
</body>
</html>
