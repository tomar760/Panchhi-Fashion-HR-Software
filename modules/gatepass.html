<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gate Pass Tracker - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-[250px] bg-white border-r border-gray-200 flex flex-col z-20 h-full">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="w-10 h-10 bg-[#7c3aed] rounded-lg flex items-center justify-center text-white font-bold text-xl mr-3">P</div>
            <div><h1 class="text-gray-900 font-bold text-lg leading-tight">Panchhi HR</h1></div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-th-large w-5 text-center"></i> <span class="text-sm font-medium">Dashboard</span></a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">HR & Payroll</p></div>
            <a href="employees.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-users w-5 text-center"></i> <span class="text-sm font-medium">Employee Directory</span></a>
            <a href="attendance.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-user-clock w-5 text-center"></i> <span class="text-sm font-medium">Attendance & Leaves</span></a>
            <a href="gatepass.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-900 bg-gray-100 rounded-lg transition font-bold"><i class="fas fa-id-badge w-5 text-center"></i> <span class="text-sm">Gate Pass</span></a>
            <a href="payroll.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-file-invoice-dollar w-5 text-center"></i> <span class="text-sm font-medium">Payroll Engine</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center px-8 shrink-0">
            <div class="text-sm font-medium text-gray-500"><i class="fas fa-home text-indigo-600 mr-2"></i> / HR / <span class="text-gray-800 ml-1">Gate Pass Tracker</span></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 grid grid-cols-1 xl:grid-cols-3 gap-8">
            <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm h-fit">
                <h3 class="text-lg font-bold text-gray-900 mb-4 border-b border-gray-100 pb-3">Issue New Gate Pass</h3>
                <div class="space-y-4">
                    <div><label class="text-xs font-bold text-gray-500">E-Code *</label><input type="text" class="w-full p-2.5 border rounded-lg text-sm mt-1 bg-gray-50 outline-none"></div>
                    <div><label class="text-xs font-bold text-gray-500">Reason *</label><textarea rows="2" class="w-full p-2.5 border rounded-lg text-sm mt-1 outline-none resize-none"></textarea></div>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-gray-500">Out Time</label><input type="time" class="w-full p-2.5 border rounded-lg text-sm mt-1 outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500">Exp. Return</label><input type="time" class="w-full p-2.5 border rounded-lg text-sm mt-1 outline-none"></div>
                    </div>
                    <button class="w-full py-3 bg-[#7c3aed] text-white rounded-lg text-sm font-bold shadow-md hover:bg-purple-700 transition"><i class="fas fa-paper-plane mr-2"></i> Auto-Sync & Issue</button>
                </div>
            </div>

            <div class="xl:col-span-2 bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-fit">
                <div class="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h3 class="font-bold text-gray-900 text-sm">Live Tracking <span class="ml-2 bg-rose-100 text-rose-600 text-[10px] px-2 py-0.5 rounded-full"><i class="fas fa-circle text-[6px] mr-1 fa-pulse"></i> LIVE</span></h3>
                    <div class="flex gap-2">
                        <button class="px-3 py-1.5 bg-white border border-gray-200 rounded text-xs font-bold text-gray-600 hover:text-emerald-600 transition"><i class="fas fa-file-excel mr-1"></i> Excel</button>
                        <button class="px-3 py-1.5 bg-white border border-gray-200 rounded text-xs font-bold text-gray-600 hover:text-rose-600 transition"><i class="fas fa-file-pdf mr-1"></i> PDF</button>
                    </div>
                </div>
                <table class="w-full text-left">
                    <thead class="bg-white border-b border-gray-100">
                        <tr><th class="py-3 px-4 text-xs font-bold text-gray-500">E-CODE</th><th class="py-3 px-4 text-xs font-bold text-gray-500">REASON</th><th class="py-3 px-4 text-xs font-bold text-gray-500">OUT TIME</th><th class="py-3 px-4 text-xs font-bold text-gray-500">STATUS</th></tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                            <td class="py-3 px-4 text-sm font-bold text-indigo-600">PF/HR/002</td><td class="py-3 px-4 text-sm text-gray-700">Bank Work</td><td class="py-3 px-4 text-sm font-mono text-gray-500">11:30 AM</td>
                            <td class="py-3 px-4"><span class="px-2.5 py-1 bg-amber-50 text-amber-600 text-[10px] font-bold rounded border border-amber-100 uppercase">Outside</span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</body>
</html>
