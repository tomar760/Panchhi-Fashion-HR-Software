<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Gate Pass Tracker - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-gray-50">
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-xl font-bold text-gray-900"><i class="fas fa-id-badge text-indigo-500 mr-2"></i> Gate Pass Register</h2>
                <a href="dashboard.html" class="text-indigo-600 text-sm font-bold hover:underline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-lg font-bold text-gray-900 mb-4">New Gate Pass</h3>
            <input type="text" placeholder="E-Code (E.g. PF/STC/035)" class="w-full p-3 border rounded-xl mb-3 outline-none focus:border-indigo-500">
            <input type="text" placeholder="Reason for Leaving" class="w-full p-3 border rounded-xl mb-3 outline-none focus:border-indigo-500">
            <button class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold shadow-lg">Generate Pass</button>
        </div>
    </div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
