<div class="btn-group">
  <button class="btn btn-success" onclick="showModal('addEmployee')"><i class="fas fa-user-plus"></i> Add Employee to Sheet</button>
</div>

<!-- Add Mega-Employee Modal -->
<div class="modal-overlay" id="modal-addEmployee">
  <div class="modal" style="text-align:left; max-width:800px; width:95vw; height:80vh; overflow-y:auto;">
    <button class="modal-close" onclick="closeModal('addEmployee')"><i class="fas fa-xmark"></i></button>
    <h3 style="color:var(--primary); margin-bottom:20px;">Add Employee (Mega MIS)</h3>
    
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
      <!-- Personal Info -->
      <div class="form-group"><label>First Name</label><input type="text" id="empFirstName"></div>
      <div class="form-group"><label>Last Name</label><input type="text" id="empLastName"></div>
      <div class="form-group"><label>Name as per Aadhar</label><input type="text" id="empFullName"></div>
      
      <!-- Contact -->
      <div class="form-group"><label>Mobile</label><input type="tel" id="empMobile"></div>
      <div class="form-group"><label>Personal Email</label><input type="email" id="empPersEmail"></div>
      
      <!-- Work Info -->
      <div class="form-group"><label>Department</label>
        <select id="empDept"><option>Operations</option><option>Sales</option><option>Admin</option></select>
      </div>
      <div class="form-group"><label>Designation</label><input type="text" id="empDesig"></div>
      <div class="form-group"><label>Base CTC</label><input type="number" id="empFixCtc"></div>
      
      <!-- KYC Data -->
      <div class="form-group"><label>Aadhar No.</label><input type="text" id="empAadhar" placeholder="XXXX-XXXX-XXXX"></div>
      <div class="form-group"><label>PAN No.</label><input type="text" id="empPan"></div>
    </div>
    
    <button class="btn btn-primary ripple" onclick="submitNewEmployee(this)" style="margin-top:20px; width:100%; justify-content:center;">
      <i class="fas fa-save"></i> Submit to Google Master Sheet
    </button>
  </div>
</div>
