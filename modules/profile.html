<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Profile - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; background-color: #f8fafc; } </style>
</head>
<body class="flex h-screen overflow-hidden">
    <!-- LIGHT SIDEBAR -->
    <aside class="w-[250px] bg-white border-r border-gray-200 flex flex-col z-20 h-full">
        <div class="h-20 flex items-center px-6 border-b border-gray-100">
            <div class="w-10 h-10 bg-[#7c3aed] rounded-lg flex items-center justify-center text-white font-bold text-xl mr-3">P</div>
            <div><h1 class="text-gray-900 font-bold text-lg leading-tight">Panchhi HR</h1></div>
        </div>
        <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-th-large w-5 text-center"></i> <span class="text-sm font-medium">Dashboard</span></a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">System</p></div>
            <a href="settings.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-cog w-5 text-center"></i> <span class="text-sm font-medium">Settings</span></a>
            <a href="profile.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-900 bg-gray-100 rounded-lg transition font-bold"><i class="fas fa-user-circle w-5 text-center"></i> <span class="text-sm font-medium">Profile</span></a>
            <div class="pt-4 pb-1"><p class="px-3 text-[10px] font-bold text-indigo-300 uppercase tracking-wider">Back</p></div>
            <a href="employees.html" class="flex items-center gap-3 px-3 py-2.5 text-gray-600 hover:bg-gray-50 rounded-lg transition"><i class="fas fa-arrow-left w-5 text-center"></i> <span class="text-sm font-medium">Back to HR</span></a>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-full overflow-hidden">
        <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-8 shrink-0">
            <div class="text-sm font-medium text-gray-500"><i class="fas fa-home text-indigo-600 mr-2"></i> / System / <span class="text-gray-800 ml-1">Admin Profile</span></div>
        </header>

        <div class="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-3 gap-8 max-w-5xl">
            <!-- Profile Card -->
            <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden h-fit">
                <div class="h-24 bg-[#7c3aed] relative"></div>
                <div class="px-6 pb-6 text-center -mt-12 relative">
                    <div class="w-24 h-24 rounded-full border-4 border-white bg-white mx-auto shadow-md relative group cursor-pointer">
                        <div class="w-full h-full rounded-full bg-indigo-50 flex items-center justify-center text-3xl font-black text-[#7c3aed]">AD</div>
                        <div class="absolute inset-0 bg-black/50 rounded-full hidden group-hover:flex items-center justify-center text-white"><i class="fas fa-camera"></i></div>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mt-3">Aditya Tomar</h3>
                    <p class="text-xs font-bold text-indigo-600 uppercase tracking-widest mt-1">Super Admin</p>
                </div>
            </div>

            <div class="md:col-span-2 space-y-6">
                <!-- Info Form -->
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                    <h4 class="text-md font-bold text-gray-900 mb-4 border-b border-gray-100 pb-2">Personal Information</h4>
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">First Name</label><input type="text" value="Aditya" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">Last Name</label><input type="text" value="Tomar" class="w-full p-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm font-bold outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">Mobile Number</label><input type="text" value="+91 9876543210" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">Location</label><input type="text" value="Gujarat, India" class="w-full p-2.5 border border-gray-200 rounded-lg text-sm outline-none"></div>
                    </div>
                    <div class="mt-4 flex justify-end"><button class="px-5 py-2.5 bg-[#7c3aed] text-white rounded-lg text-sm font-bold shadow-md hover:bg-purple-700">Save Changes</button></div>
                </div>

                <!-- Security Form -->
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                    <h4 class="text-md font-bold text-gray-900 mb-4 border-b border-gray-100 pb-2">Security</h4>
                    <div class="space-y-4">
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">Current Password</label><input type="password" placeholder="••••••••" class="w-full md:w-1/2 p-2.5 border border-gray-200 rounded-lg text-sm outline-none"></div>
                        <div><label class="text-xs font-bold text-gray-500 block mb-1">New Password</label><input type="password" placeholder="Enter new password" class="w-full md:w-1/2 p-2.5 border border-gray-200 rounded-lg text-sm outline-none"></div>
                    </div>
                    <div class="mt-4"><button class="px-5 py-2.5 bg-gray-900 text-white rounded-lg text-sm font-bold shadow-md hover:bg-black">Update Password</button></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
