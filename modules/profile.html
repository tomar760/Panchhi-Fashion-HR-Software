<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Panchhi HR Software</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-brand">
                <div class="brand-icon"><i class="fas fa-feather-pointed"></i></div>
                <div class="brand-text">
                    <h2 class="aditya-branding">Panchhi HR</h2>
                    <span>by Aditya Tomar</span>
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-section">
                    <a class="nav-link" href="dashboard.html"><i class="fas fa-th-large"></i> Dashboard</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">HR & Payroll</div>
                    <a class="nav-link" href="employees.html"><i class="fas fa-users"></i> Employee Directory</a>
                    <a class="nav-link" href="attendance.html"><i class="fas fa-calendar-check"></i> Attendance</a>
                    <a class="nav-link" href="gatepass.html"><i class="fas fa-door-open"></i> Gate Pass</a>
                    <a class="nav-link" href="payroll.html"><i class="fas fa-money-bill-wave"></i> Payroll</a>
                    <a class="nav-link" href="ledger.html"><i class="fas fa-book"></i> Ledger</a>
                </div>
                <div class="nav-section">
                    <div class="nav-section-title">System</div>
                    <a class="nav-link" href="store.html"><i class="fas fa-boxes-stacked"></i> Store</a>
                    <a class="nav-link" href="settings.html"><i class="fas fa-sliders"></i> Settings</a>
                    <a class="nav-link active" href="profile.html"><i class="fas fa-user-circle"></i> Profile</a>
                </div>
            </div>
            <div class="sidebar-user">
                <div class="user-avatar">AT</div>
                <div class="user-info"><h4>Aditya Tomar</h4><span><span class="online-dot"></span>Super Admin</span></div>
            </div>
        </nav>

        <div class="main-content">
            <header class="top-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                    <div class="greeting"><h1 id="greetingText">Good Morning, Aditya! 👋</h1></div>
                </div>
                <div class="header-right">
                    <div class="live-clock"><i class="fas fa-clock"></i> <span id="liveClock">00:00:00</span></div>
                    <div class="header-avatar">AT</div>
                </div>
            </header>

            <div class="page-content">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-avatar-lg">AT</div>
                        <div class="profile-info">
                            <h2>Aditya Tomar</h2>
                            <p>Super Admin · Panchhi HR Software</p>
                            <div style="display:flex;gap:8px;margin-top:8px">
                                <span class="badge badge-purple"><i class="fas fa-crown" style="margin-right:4px"></i>Super Admin</span>
                                <span class="badge badge-green"><i class="fas fa-circle" style="font-size:5px;margin-right:4px"></i>Online</span>
                            </div>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                        <div class="form-group"><label>Full Name</label><input type="text" value="Aditya Tomar"></div>
                        <div class="form-group"><label>Email</label><input type="email" value="admin@panchhihr.com"></div>
                        <div class="form-group"><label>Role</label><input type="text" value="Super Admin" disabled style="background:var(--gray-100)"></div>
                        <div class="form-group"><label>Department</label><input type="text" value="Administration"></div>
                    </div>
                    <h3 style="margin-top:24px;margin-bottom:16px;font-size:15px"><i class="fas fa-lock" style="color:var(--primary);margin-right:8px"></i> Change Password</h3>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                        <div class="form-group"><label>Current Password</label><input type="password" placeholder="Enter current password"></div>
                        <div class="form-group"><label>New Password</label><input type="password" placeholder="Enter new password"></div>
                    </div>
                    <div style="display:flex;gap:12px;margin-top:16px">
                        <button class="btn btn-primary ripple" onclick="processBtn(this,'Profile updated successfully!')"><i class="fas fa-save"></i> Save Changes</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"><div class="toast-icon" id="toastIcon"></div><div class="toast-text"><h4 id="toastTitle"></h4><p id="toastMessage"></p></div></div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
