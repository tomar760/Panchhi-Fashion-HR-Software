<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Attendance - Panchhi HR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body class="bg-gray-50">
    <div class="p-8">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Daily Attendance</h2>
                <a href="dashboard.html" class="text-indigo-600 text-sm font-bold hover:underline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
            </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex gap-4 mb-6">
                <input type="date" class="p-2 border rounded-lg outline-none">
                <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-md">Fetch Data</button>
            </div>
            <table class="w-full">
                <thead class="bg-gray-50"><tr><th>E-Code</th><th>Name</th><th>In-Time</th><th>Status</th></tr></thead>
                <tbody>
                    <tr><td class="font-bold text-indigo-600">PF/ADM/005</td><td>Pursottam</td><td>10:05 AM</td><td><span class="text-emerald-600 font-bold">PRESENT</span></td></tr>
                </tbody>
            </table>
        </div>
    </div>
    <script src="../assets/js/app.js"></script>
</body>
</html>
